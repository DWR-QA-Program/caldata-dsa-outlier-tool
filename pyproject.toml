[project]
name = "caldata-dsa-dwr"
version = "0.1.0"
description = "CalData's DSA project with DWR"
authors = [{ name = "Monica Bobra", email = "monica.bobra@innovation.ca.gov" }]
requires-python = ">=3.10,<3.11"
readme = "README.md"
dependencies = [
    "scikit-learn>=1.6.0,<2",
    "pandas>=2.2.3,<3",
    "numpy>=2.2.0,<3",
    "matplotlib>=3.10.0,<4",
    "jupyterlab>=4.3.3,<5",
    "shiny~=1.2",
    "shinyswatch>=0.8,<0.9",
    "shinywidgets>=0.5,<0.6",
    "plotly==5.24",
    "dateparser~=1.2",
    "openpyxl~=3.1",
    "seaborn>=0.13.2,<0.14",
    "pytest>=8.3.5,<9",
    "tsfresh>=0.21.0,<0.22",
    "pre-commit>=4.2.0,<5",
    "ruff>=0.12.8,<0.13",
    "diskcache>=5.6,<6"
]

[dependency-groups]
hostdev = ["rsconnect-python~=1.25"]

[tool.uv]
package = false
default-groups = ["hostdev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 108
respect-gitignore = true
lint.select = [
  "B", # flake8-bugbear
  "C4", # comprehensions
  "E", # pycodestyle
  "F", # pyflakes
  "I", # isort
  "ISC", # flake8-implicit-str-concat
  "PGH", # pygrep-hooks
  "PLC", # pylint
  "PLE", # pylint
  "PLR", # pylint import style
  "PLW", # pylint
  "RET", # flake8-return
  "RUF", # ruff-specific rules
  "Q", # flake8-quotes
  "SIM", # flake8-simplify
  "T10", # flake8-debugger
  "TID", # flake8-tidy-imports
  "UP", # pyupgrade
  "W", # pycodestyle
  "YTT", # flake8-2020
]
lint.ignore = [
  "D100", # public module
  "D101", # public class
  "D102", # public method
  "D103", # public function
  "D104", # public package
  "D203", # blank line before docstring
  "D212", # Start multi-line docstring at the second line.
  "E501", # line length handled by black
  "ISC001", # Handled by formatter
  "PLR0913", # too many arguments
  "PLR0912", # too many branches
  "RET505", # no-else-return
  "RET506", # no-else-raise
  "RUF006", # force storing return values
  "Q001", # multiline quotes
]
exclude = [
    "dwr/*ipynb"
]
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"dwr/tests/*py" = ["PLR2004"] # magic numbers are fine in tests

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "single"
